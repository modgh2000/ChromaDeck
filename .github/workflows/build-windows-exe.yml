      - name: Extract Chinese/English (i18n) localization patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $b64 = Get-Content -Path "_patch.b64" -Raw
          $bytes = [Convert]::FromBase64String($b64)
          [IO.File]::WriteAllBytes((Join-Path $PWD "_i18n_patch.tar.gz"), $bytes)
          tar -xzf "_i18n_patch.tar.gz"
          Remove-Item -Force "_patch.b64", "_i18n_patch.tar.gz"
          Write-Host "Applied Chinese/English localization patch successfully!"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm install

      - name: Build Tauri Windows EXE & MSI installers
        shell: pwsh
        run: npm run tauri build

      - name: Build Portable ZIP
        shell: pwsh
        run: npm run bundle:portable

      - name: Upload Windows EXE Installer & Portable Bundle (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ChromaDeck-v0.8.2-zh-EN-Windows-x64-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*-portable.zip
            src-tauri/target/release/chromadeck.exe

      - name: Publish Windows EXE Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2-i18n
          name: "ChromaDeck v0.8.2 (中英文双语版) Windows 安装包"
          body: |
            ## ChromaDeck v0.8.2 中英文双语完整版 (Chinese / English i18n Edition)
            - 新增顶部 `[中文 | EN]` 实时语言切换器与 `Alt + L` 全局快捷键
            - 完整汉化显示器管理、预设库、预设编辑器、应用/删除弹窗及状态提示
            - 新增 Windows 系统托盘菜单中英文实时同步 (`显示主窗口` / `立即重新应用` / `退出程序`)
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*-portable.zip
            src-tauri/target/release/chromadeck.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
