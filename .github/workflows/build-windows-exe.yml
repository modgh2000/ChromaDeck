name: Build Windows EXE Installer (ChromaDeck i18n)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Build Tauri Windows EXE & MSI installers
        shell: pwsh
        run: npm run tauri build

      - name: Build Portable ZIP
        shell: pwsh
        run: npm run bundle:portable

      - name: Upload Windows EXE Installer & Portable Bundle (Actions Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ChromaDeck-v0.8.2-zh-EN-Windows-x64-Installers
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*-portable.zip
            src-tauri/target/release/chromadeck.exe

      - name: Publish Windows EXE Installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v0.8.2-i18n
          name: ChromaDeck v0.8.2 (中英文双语版) Windows 安装包
          body: |
            ChromaDeck v0.8.2 中英文双语版 Windows 安装包。
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/portable/*-portable.zip
            src-tauri/target/release/chromadeck.exe
